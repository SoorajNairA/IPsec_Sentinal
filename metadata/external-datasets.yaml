    display_name: Encrypted VPN Dataset (USBVPN2022)
    version: "2022-11-04"
    doi: 10.5281/zenodo.7301756
    landing_url: https://zenodo.org/records/7301756
    citation: "M. Naas and J. Fesl, A novel dataset for encrypted virtual private network traffic analysis, Data in Brief 47 (2023) 108945."
    publisher: Zenodo
    published_at: "2022-11-04"
    license:
      name: CC BY 4.0
      evidence_url: https://zenodo.org/records/7301756
      retrieved_at: "2026-09-26"
      redistribution_status: allowed
    declared_protocols: [l2tp_ipsec_natt]
    declared_formats: [zip]
    declared_labels: []
    intended_use: Inspect the actual L2TP-IPsec subset for packet-session external application-class validation.
    acquisition_state: verified
    inspection:
      state: incompatible
      inspected_at: "2026-09-26"
      artifact_sha256: 8039945ffa3f22ff9443787dfbeaf74fd89d33cddd292dcaa6f7cc4b9fe2f54e
      observed_formats: [zip, json]
      observed_protocols: [l2tp_ipsec_natt]
      observed_labels: [mail, meet, non_streaming, ssh, streaming]
      adapter_id: null
      notes:
        - L2TP IPsec subset contains five JSON files with top-level flow/session objects.
        - Each x_packets entry preserves timestamp_start/timestamp_end, signed byte length, IP header length, and packet count; signed bytes encode direction.
        - Mapped UDP/4500 flows contain rows that aggregate multiple packets, so individual packet sizes and timing cannot be reconstructed without invention.
        - Clean meet rows are unrelated ICMP flows, not the mapped NAT-T workload.
        - UDP/4500 NAT-T observations are external-evaluation inputs, not native protocol-50 ESP PCAPs.
        - No packet-session adapter is available; non_streaming and ssh also remain unmapped.
    artifacts:
